services:
  postgres:
    container_name: kaskara-postgres
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    networks:
      - kaskara-network
    volumes:
      - kaskara-pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
    networks:
      - kaskara-network
    depends_on:
      - postgres

  postgres-test:
    container_name: kaskara-postgres-test
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${PG_TEST_USER}
      POSTGRES_PASSWORD: ${PG_TEST_PASSWORD}
      POSTGRES_DB: ${PG_TEST_DB}

  mailhog:
    container_name: kaskara-mailhog
    image: mailhog/mailhog:latest
    logging:
      driver: 'none' # Optional: minimizes log clutter
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  kaskara-pgdata:

networks:
  kaskara-network:
    driver: bridge
